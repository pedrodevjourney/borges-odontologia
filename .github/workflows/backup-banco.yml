name: Backup diário do banco

# O free tier do Neon não tem backup gerenciado. Este workflow faz o dump e
# guarda no mesmo bucket das radiografias.
# Atenção: o agendamento do GitHub Actions é impreciso e pode atrasar dezenas de
# minutos — para backup diário isso é irrelevante.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 03:00 em Brasília
  workflow_dispatch: # permite rodar na mão pelo painel do GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Cliente 18 porque o banco no Neon é Postgres 18: o pg_dump recusa dumpar um
      # servidor mais NOVO que ele (mas lida bem com servidores mais antigos).
      - name: Instalar cliente do PostgreSQL 18
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # O `pg_dump` do PATH continua sendo o 16 pré-instalado no runner; o passo
          # seguinte chama o 18 pelo caminho completo.
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Gerar dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # pipefail é essencial: sem ele o código de saída do pipe é o do gzip, e um
          # pg_dump que aborta gera um .gz vazio com o step ficando VERDE.
          set -euo pipefail

          test -n "$DATABASE_URL" || { echo "Secret DATABASE_URL não configurado"; exit 1; }

          # Caminho completo de propósito: o runner já traz pg_dump 16 no PATH, que
          # recusa dumpar o servidor 18 ("server version mismatch").
          PGDUMP=/usr/lib/postgresql/18/bin/pg_dump
          "$PGDUMP" --version

          ARQUIVO="odonto-$(date -u +%Y-%m-%d).sql.gz"
          echo "ARQUIVO=$ARQUIVO" >> "$GITHUB_ENV"
          "$PGDUMP" --no-owner --no-privileges "$DATABASE_URL" | gzip -9 > "$ARQUIVO"

          # Cinto de segurança: um dump plausível tem as tabelas e passa de 1 KB.
          TAMANHO=$(stat -c%s "$ARQUIVO")
          echo "Tamanho do dump: $TAMANHO bytes"
          test "$TAMANHO" -gt 1024 || { echo "Dump suspeito de vazio ($TAMANHO bytes)"; exit 1; }
          zcat "$ARQUIVO" | grep -q "CREATE TABLE public.pacientes" \
            || { echo "Dump não contém a tabela pacientes"; exit 1; }
          ls -lh "$ARQUIVO"

      - name: Enviar para o Supabase Storage
        env:
          STORAGE_URL: ${{ secrets.STORAGE_URL }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
        run: |
          CODIGO=$(curl -s -o /tmp/resposta.txt -w "%{http_code}" \
            -X POST "$STORAGE_URL/storage/v1/object/Backups/$ARQUIVO" \
            -H "Authorization: Bearer $STORAGE_SERVICE_KEY" \
            -H "Content-Type: application/gzip" \
            -H "x-upsert: true" \
            --data-binary "@$ARQUIVO")
          echo "HTTP $CODIGO"
          cat /tmp/resposta.txt
          test "$CODIGO" -lt 300

      # Rede de segurança: o artifact fica no próprio GitHub por 30 dias, para o
      # caso de o bucket estar indisponível ou pausado.
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: ${{ env.ARQUIVO }}
          retention-days: 30
