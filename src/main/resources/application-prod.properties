# --- Porta ---
# O Render (como Heroku e afins) injeta a porta em PORT e roteia o tráfego para ela.
# Sem isto o Tomcat sobe em 8080, o roteador do Render bate na 10000 e a requisição
# fica pendurada até dar timeout — o contêiner parece vivo, mas nada responde.
server.port=${PORT:8080}

# --- Database (produção via variáveis de ambiente) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Free tier: pool pequeno de propósito (o Neon tem limite de conexões e o
# container tem 512 MB de RAM).
spring.datasource.hikari.maximum-pool-size=5

# minimum-idle=0 é a peça que protege a cota do Neon. Com 1 conexão ociosa
# permanente, o Neon nunca suspende o compute e a API acordada 14 h/dia consumiria
# ~91 das 100 CU-h/mês do plano gratuito — e estourar não deixa o banco lento, deixa
# ele PARADO. Com 0, as conexões fecham após 30 s sem uso e o compute suspende nos
# intervalos entre pacientes. Custo: ~1 s a mais na primeira query depois de uma pausa.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

# --- Admin de produção (nunca hardcoded) ---
admin.name=${ADMIN_NAME}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# --- Arquivos: Supabase Storage (o disco do container é apagado a cada deploy) ---
app.storage.type=${STORAGE_TYPE:supabase}
# Sem placeholder obrigatório aqui: quem cobra as variáveis é o SupabaseFileStorage,
# com mensagem explícita — e só quando o storage do Supabase é de fato o escolhido.
app.storage.supabase.url=${STORAGE_URL:}
# Nome de bucket no Supabase é case-sensitive — o bucket criado chama "Radiografias".
app.storage.supabase.bucket=${STORAGE_BUCKET:Radiografias}
app.storage.supabase.service-key=${STORAGE_SERVICE_KEY:}

# Obs.: spring.main.lazy-initialization NÃO é usado aqui de propósito — ela pode
# adiar o initializer do Flyway para depois da validação do Hibernate, e a
# aplicação quebraria no boot com "missing table". O ganho de RAM não paga o risco.

# --- Logs ---
logging.level.root=INFO
logging.level.com.odonto.api=INFO
