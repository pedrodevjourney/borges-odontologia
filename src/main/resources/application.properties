# --- Jackson ---
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- JPA ---
# O schema é definido pelas migrations do Flyway, não pelo Hibernate.
# "validate" faz a aplicação falhar no boot se o banco divergir das entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway (fonte da verdade do schema) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate fica APENAS no perfil dev (bancos locais criados por
# ddl-auto=update). Em produção precisa ser estrito: se o banco tiver qualquer
# tabela antes do primeiro deploy, o baseline pularia a V1 em silêncio e o
# Hibernate quebraria depois com "missing table".
spring.flyway.baseline-on-migrate=false

# --- JWT ---
# Sem valor padrão de propósito: a aplicação deve falhar no boot se o segredo não
# estiver configurado, em vez de subir com um segredo previsível versionado no Git.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# --- CORS (origens do front, separadas por vírgula) ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# --- Armazenamento de arquivos (radiografias) ---
# local    -> disco local (desenvolvimento)
# supabase -> Supabase Storage (produção: o filesystem do container é efêmero)
app.storage.type=${STORAGE_TYPE:local}
app.storage.supabase.bucket=${STORAGE_BUCKET:Radiografias}
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
