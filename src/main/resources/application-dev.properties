# --- Database (local) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/odonto_db
spring.datasource.username=odonto_user
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Admin de demonstração ---
admin.name=Demo
admin.email=demo@clinica.com
admin.password=demo123

# --- CORS (Vite local) ---
app.cors.allowed-origins=http://localhost:5173

# --- JWT (segredo exclusivo de desenvolvimento; produção exige a env JWT_SECRET) ---
jwt.secret=ZGV2LW9ubHktc2VjcmV0LW5hby11c2FyLWVtLXByb2R1Y2FvLW9kb250by1hcGktZGVzZW52b2x2aW1lbnRvLWxvY2FsLTIwMjY=

# --- Arquivos em disco local ---
app.storage.type=local

# Banco de desenvolvimento que já existia antes do Flyway (criado por
# ddl-auto=update) é baselinado em vez de receber a V1 por cima. Só em dev.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.com.odonto.api.auth.security=DEBUG
logging.level.org.springframework.security=DEBUG
