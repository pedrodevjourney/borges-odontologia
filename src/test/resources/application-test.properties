# Perfil de teste — complementa (não substitui) o application.properties principal.
#
# Mesmo engine da produção (Postgres) de propósito: H2 em teste esconde diferenças
# de tipo, constraint e migration que só apareceriam em produção.
# Localmente: suba o Postgres e crie o banco `odonto_test`.
# No CI: o service container do workflow já provê estas credenciais.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/odonto_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# As migrations rodam do zero: se a V1 não aplicar limpa, o teste falha — que é
# exatamente o portão desejado.
spring.flyway.baseline-on-migrate=false

jwt.secret=dGVzdGUtc29tZW50ZS1uYW8tdXNhci1mb3JhLWRvcy10ZXN0ZXMtb2RvbnRvLWFwaS0yMDI2
app.cors.allowed-origins=http://localhost:5173
app.storage.type=local
app.upload.dir=target/test-uploads

